name: Guard a dependency branch against being updated while its PR is pending
description: |
  Determines whether `peter-evans/create-pull-request` may update a dependency branch.

  That action force-pushes its branch to "base branch + its own single commit" on every run. Since
  the base branch moves almost daily, an existing dependency branch would be re-pushed every day,
  restarting CI on its PR each time, and any commits pushed to the branch by a human would be
  silently discarded. This guard therefore reports that the update should be skipped whenever the
  branch already exists, leaving the pending PR (and any work on it) untouched. Branches are deleted
  automatically when their PR is merged, after which the bot resumes updating the dependency.
inputs:
  branch:
    description: 'Name of the dependency branch that would be updated'
    required: true
  token:
    description: 'GitHub token'
    required: true
outputs:
  skip:
    description: "'true' if the branch already exists and must not be updated"
    value: ${{ steps.guard.outputs.skip }}
runs:
  using: 'composite'
  steps:
      - name: Check whether the dependency branch already exists
        id: guard
        shell: bash
        env:
          GH_TOKEN:   ${{ inputs.token      }}
          BRANCH:     ${{ inputs.branch     }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status=$(gh api "repos/${REPOSITORY}/branches/${BRANCH}" --silent 2>&1 && echo found || true)
          if [ "${status}" = "found" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dependency branch not updated::Branch '${BRANCH}' already exists, so its pending PR is left untouched (re-pushing it would restart CI). Merge the PR, or delete the branch, to re-enable automatic updates."
          elif echo "${status}" | grep -q "HTTP 404"; then
            echo "Branch '${BRANCH}' does not exist - it is safe to create."
          else
            # Any other failure (rate limit, network, bad token) - skip rather than risk a force-push.
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Dependency branch check failed::Could not determine whether '${BRANCH}' exists: ${status}"
          fi
