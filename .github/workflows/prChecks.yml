name: 'PR-Checks'
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - master
concurrency:
  group: prCheck-${{ github.ref }}
  cancel-in-progress: true  
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  # Validate YAML
  Validate-YAML:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "Set environmental variables"
        run: |
          echo "GALACTICUS_EXEC_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: Mark directory safe        
        run: |
          git config --global --add safe.directory $GALACTICUS_EXEC_PATH
      - name: Install tools
        run: |
          sudo apt -y update
          sudo apt install -y yamllint
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **/*.yml
          safe_output: false
      # NOTE: the names of the files changed by the pull request are passed in through the environment, and never interpolated
      # into the script text with `${{ }}`: they are chosen by whoever opened the pull request, and git permits characters in
      # them which are special to the shell. `set -f` prevents a name containing a glob character being expanded. Because the
      # names are passed through the environment rather than interpolated, the escaping which `changed-files` applies by
      # default is unnecessary here, and actively harmful - it inserts backslashes into names containing (for example) a
      # colon, so that the file can no longer be opened. It is therefore disabled via `safe_output: false`.
      - name: Validate any YAML files
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          set -f
          status=0
          for file in ${CHANGED_FILES}; do
            if yamllint "$file"; then
              echo "YAML $file is valid"
            else
              echo "YAML $file is invalid"
              status=1
            fi
          done
          exit $status
  # Check documentation links
  Check-Documentation-Links:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **/*.md
            **/*.rst
          safe_output: false
      - name: Check for links to retired PDF manuals
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          set -f
          status=0
          for file in ${CHANGED_FILES}; do
            if grep -nE 'releases/download/[^)]*Galacticus_[A-Za-z]+\.pdf' "$file"; then
              echo "::error file=$file::Link to a retired Galacticus_*.pdf manual found in $file - link to the ReadTheDocs documentation (https://galacticus.readthedocs.io) instead."
              status=1
            fi
          done
          exit $status
  # Validate XML
  Validate-XML:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "Set environmental variables"
        run: |
          echo "GALACTICUS_EXEC_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: Mark directory safe        
        run: |
          git config --global --add safe.directory $GALACTICUS_EXEC_PATH
      - name: Install tools
        run: |
          sudo apt -y update
          sudo apt install -y libxml2-utils
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **/*.xml
          safe_output: false
      - name: Validate any XML files
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          set -f
          status=0
          for file in ${CHANGED_FILES}; do
            echo "Validating XML file: $file"
            if xmllint --noout "$file"; then
              echo "XML $file is valid"
            else
              echo "XML $file is invalid"
              status=1
            fi
          done
          exit $status
  # Validate Python scripts
  Validate-Python-Scripts:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    container: ghcr.io/galacticusorg/buildenv:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "Set environmental variables"
        run: |
          echo "GALACTICUS_EXEC_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: Mark directory safe
        run: |
          git config --global --add safe.directory $GALACTICUS_EXEC_PATH
      - name: Get changed scripts
        id: changed-scripts
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **/*.py
          safe_output: false
      - name: Validate any Python scripts
        env:
          CHANGED_FILES: ${{ steps.changed-scripts.outputs.all_changed_files }}
        run: |
          set -f
          status=0
          for file in ${CHANGED_FILES}; do
            if python3 -m py_compile "$file"; then
              echo "Python script $file compiles correctly"
            else
              echo "Python script $file fails to compile"
              status=1
            fi
          done
          exit $status
  # Embedded docstrings must be reStructuredText (not the old LaTeX form).
  Validate-Docstrings-RST:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    container: ghcr.io/galacticusorg/buildenv:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "Set environmental variables"
        run: |
          echo "GALACTICUS_EXEC_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: Mark directory safe
        run: |
          git config --global --add safe.directory $GALACTICUS_EXEC_PATH
      - name: Check embedded docstrings are reStructuredText
        run: |
          python3 scripts/doc/convertDocstringsToRST.py --check source
      # The check above proves each docstring has *been converted*; because the
      # conversion is idempotent it skips regions already marked as RST, so it
      # cannot see LaTeX surviving *inside* them. This is that check, held to a
      # baseline that may only shrink as the migration finishes.
      - name: Check no LaTeX remains inside converted docstrings
        run: |
          python3 scripts/doc/convertDocstringsToRST.py --check-residual source
  # Fortran static analysis
  Fortran-Static-Analysis:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    container: ghcr.io/galacticusorg/buildenv:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "Set environmental variables"
        run: |
          echo "GALACTICUS_EXEC_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: Mark directory safe        
        run: |
          git config --global --add safe.directory $GALACTICUS_EXEC_PATH
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **/*.F90
          safe_output: false
      - name: Perform static analysis on Fortran files
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          set -f
          status=0
          for file in ${CHANGED_FILES}; do
            if PYTHONPATH=$GITHUB_WORKSPACE/python python3 scripts/aux/staticAnalyzer.py "$file"; then
              echo "Fortran file $file passes analysis"
            else
              echo "Fortran file $file fails analysis"
              status=1
            fi
          done
          exit $status
  # Embedded XML directive validation (the LaTeX checks were retired with the
  # migration of the embedded documentation to reStructuredText).
  Validate-Embedded-XML:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    container: ghcr.io/galacticusorg/buildenv:latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "Set environmental variables"
        run: |
          echo "GALACTICUS_EXEC_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "PYTHONPATH=$GITHUB_WORKSPACE/python" >> $GITHUB_ENV
      - name: Mark directory safe
        run: |
          git config --global --add safe.directory $GALACTICUS_EXEC_PATH
      - name: Install tools
        run: |
          apt -y update
          apt install -y python3-lxml
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **/*.F90
            **/*.Inc
          safe_output: false
      - name: Validate embedded XML directives
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          set -f
          status=0
          for file in ${CHANGED_FILES}; do
            if PYTHONPATH=$GITHUB_WORKSPACE/python python3 scripts/aux/embeddedAnalyzer.py "$file" warnings.md; then
              echo "Embedded XML in file $file passes validation"
            else
              echo "Embedded XML in file $file fails validation"
              status=1
            fi
          done
          exit $status
  # Spell-check the reStructuredText documentation (advisory — does not fail the
  # build). Builds the docs with sphinxcontrib-spelling and posts any possible
  # misspellings as a PR comment; add legitimate technical terms to aux/words.dict.
  Spell-Check-RST:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents:      read
      pull-requests: write # required to post the spell-check results as a comment on the pull request
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "Set environmental variables"
        run: |
          echo "GALACTICUS_EXEC_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: Mark directory safe
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - name: Install tools
        run: |
          sudo apt -y update
          sudo apt install -y enchant-2 aspell aspell-en poppler-utils
          pip install -r docs/requirements.txt sphinxcontrib-spelling pyenchant
      - name: Build documentation and spell-check
        run: |
          PYTHONPATH=$GITHUB_WORKSPACE/python python scripts/doc/extractDocsRST.py source docs
          SPHINX_SPELLING=1 python -m sphinx -b spelling docs docs/_spelling || true
          if find docs/_spelling -name '*.spelling' -size +0 | grep -q .; then
            {
              printf '<details><summary>RST spell-check (advisory) — possible misspellings (click to expand)</summary>\n\n'
              printf 'Add any legitimate technical terms to `aux/words.dict`.\n\n```\n'
              cat $(find docs/_spelling -name '*.spelling') | sort -u
              printf '```\n\n</details>\n'
            } > warnings.md
          fi
      - name: Check file existence
        id: check_files
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3
        with:
          files: warnings.md
      - name: Output to a job summary
        if: steps.check_files.outputs.files_exists == 'true'
        run: |
          cat warnings.md >> $GITHUB_STEP_SUMMARY
      - name: Comment on the PR if any possible misspellings were found
        if: steps.check_files.outputs.files_exists == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        with:
          file-path: warnings.md
