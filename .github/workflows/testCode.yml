name: Test Code (Reuseable Workflow)
on:
  workflow_call:
    inputs:
      runner: # The name of the runner on which to run the test
        required: false
        default: ubuntu-latest
        type: string
      artifact: # The name of the artifact to download to retrieve the executable
        required: true
        type: string
      executable: # The name of the test executable to be run and tested, or several names separated by white space
        required: true
        type: string
      expectUnrecognized: # Set to zero if unrecognized parameters are not expected, 1 if they are expected
        required: false
        default: 0
        type: number
      expectFail: # Set to zero if FAIL is not expected, 1 if FAIL is expected
        required: false
        default: 0
        type: number
      expectCrash: # Set to zero if code crash is not expected, 1 if code crash is expected
        required: false
        default: 0
        type: number
      mpi: # Set to 0/1 to indicate if the executable should be run without/with MPI
        required: false
        default: 0
        type: string
      requirePython: # Set to 0/1 to indicate if Python tools are required
        required: false
        default: 0
        type: number
      enabled: # Set to false to skip the test - used by callers with a matrix of tests to run only those which were planned
        required: false
        default: true
        type: boolean
      timeoutMinutes: # The time after which the job is stopped - a test which hangs otherwise runs for six hours
        required: false
        default: 180
        type: number
defaults:
  run:
    shell: bash
jobs:
  Test-Code:
    if: ${{ inputs.enabled }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeoutMinutes }}
    container:
      image: ${{ startsWith( format('{0}',inputs.runner), 'ubuntu') && 'ghcr.io/galacticusorg/buildenv:latest' || '' }}
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "This job is now running on a ${{ runner.os }} server."
      - run: echo "The name of the branch is ${{ github.ref }} and the repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out repository datasets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7      
        with:
          repository: galacticusorg/datasets
          path: datasets
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - name: "Set environmental variables"
        # Includes PARAM_PATH which is needed for the tests.files.exe test code.
        run: |
          echo "GALACTICUS_EXEC_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "GALACTICUS_DATA_PATH=$GITHUB_WORKSPACE/datasets" >> $GITHUB_ENV
          echo "PARAM_PATH=/home/galacticus/super/secret/stuff" >> $GITHUB_ENV
          echo "DEBIAN_FRONTEND=noninteractive" >> $GITHUB_ENV
      # Downloading the executables occasionally fails for reasons which have nothing to do with the code being tested, and a
      # failure here fails the whole run, so it is tried twice.
      - name: Download executables
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact }}
      - name: Download executables (second attempt)
        if: steps.download.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact }}
      - name: Install tools
        if: ${{ format('{0}',inputs.requirePython) == '1' }}
        run: |
          # Package installation depends on the network, so it is retried.
          for attempt in 1 2 3; do
           if apt -y update && apt -y upgrade && apt -y install python3-numpy python3-h5py; then break; fi
           if [ $attempt == 3 ]; then exit 1; fi
           sleep 20
          done
      - name: Create test suite output directory
        run: mkdir -p $GALACTICUS_EXEC_PATH/testSuite/outputs
      - name: Run test
        env:
          # Passed through the environment so that a list of names may be split across lines.
          EXECUTABLES: ${{ inputs.executable }}
        run: |
          cd $GALACTICUS_EXEC_PATH
          git config --global --add safe.directory $GALACTICUS_EXEC_PATH
          set -o pipefail
          # Each executable is run in turn, and all of them are run even if one fails, so that a job which runs many reports
          # every failure at once. An executable passes if it exits cleanly and reports no failure - or, for the tests of the
          # test harness itself, if it crashes or reports a failure as it is expected to.
          : > test.log
          failures=""
          for executable in ${EXECUTABLES}; do
           chmod u=wrx ./${executable}
           echo "::group::${executable}"
           crashed=0
           if [ ${{ inputs.mpi }} == 1 ]; then
            mpirun --oversubscribe -np 2 --allow-run-as-root ./${executable} 2>&1 | tee ${executable}.log || crashed=1
           else
            ./${executable} 2>&1 | tee ${executable}.log || crashed=1
           fi
           echo "::endgroup::"
           failed=0
           if grep -q FAIL ${executable}.log; then failed=1; fi
           if [ $crashed != ${{ inputs.expectCrash }} ] || [ $failed != ${{ inputs.expectFail }} ]; then
            failures="${failures} ${executable}"
            echo "::error title=Unit test::${executable} did not behave as expected (crashed: ${crashed}, reported a failure: ${failed})"
           fi
           cat ${executable}.log >> test.log
          done
          if [ -n "${failures}" ]; then
           echo "# :x: Unit tests which did not behave as expected" >> $GITHUB_STEP_SUMMARY
           for executable in ${failures}; do echo "- \`${executable}\`" >> $GITHUB_STEP_SUMMARY; done
           exit 1
          fi
      # This action only supplies the job's URL for the summary written below. It queries the GitHub API, and has failed a
      # job whose test had already passed when that query timed out, so a failure here is not allowed to fail the job.
      - uses: qoomon/actions--context@e12e182be797e3476990faf801dd1b87f107f91c # v5
        continue-on-error: true
      - name: "Check for unrecognized parameters"
        if: ${{ format('{0}',inputs.expectUnrecognized) == '0' }}
        run: |
          cd $GALACTICUS_EXEC_PATH
          grep "unrecognized parameter" test.log > unrecognized.txt || true
          if [ -s "unrecognized.txt" ]; then
           echo "# :warning: Unrecognized parameters from ${GITHUB_JOB_NAME} :warning:" >> $GITHUB_STEP_SUMMARY
           echo ":information_source: Job log can be found [here](${GITHUB_JOB_URL})" >> $GITHUB_STEP_SUMMARY
           cat unrecognized.txt >> $GITHUB_STEP_SUMMARY
          fi
      - run: echo "This job's status is ${{ job.status }}."
