name: 'HDF5-Diff'
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: hdf5Diff-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  # Generate diffs of HDF5 files that are changed in a PR. Also provides links to an online HDF5 viewer.
  HDF5-Diff:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents:      read
      pull-requests: write # required to post the diff as a comment on the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 'Fetch master branch'
        run: |
          git fetch origin master --depth 1
      - name: "Set environmental variables"
        run: |
          echo "GALACTICUS_EXEC_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: Mark directory safe        
        run: |
          git config --global --add safe.directory $GALACTICUS_EXEC_PATH
          git config --local --add include.path ../.gitconfig
      - name: Install tools
        run: |
          sudo apt -y update
          sudo apt install -y hdf5-tools
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: |
            **/*.hdf5
      - name: Begin output if any files are changed
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo '# Changed HDF5 files' >> diffs.md
      # NOTE: values which originate from the pull request (branch names, and the names of the files it changes) are passed into
      # the scripts below through the environment, and never interpolated into the script text with `${{ }}`. Both are chosen by
      # whoever opened the pull request, and git permits characters in them which are special to the shell, so interpolating them
      # directly would allow arbitrary commands to be run on the runner. `set -f` additionally prevents a file name containing a
      # glob character from being expanded against the workspace.
      - name: Identify any new HDF5 files
        env:
          ADDED_FILES:   ${{ steps.changed-files.outputs.added_files }}
          HEAD_REPO_URL: ${{ github.event.pull_request.head.repo.html_url }}
          HEAD_REF:      ${{ github.head_ref }}
        run: |
          set -f
          for file in ${ADDED_FILES}; do
            echo Added: "${file}"
            echo "* Added: [${file}](https://myhdf5.hdfgroup.org/view?url=${HEAD_REPO_URL}/${HEAD_REF}/blob/${file})" >> diffs.md
          done
      - name: Identify any deleted HDF5 files
        env:
          DELETED_FILES: ${{ steps.changed-files.outputs.deleted_files }}
          HEAD_REPO_URL: ${{ github.event.pull_request.head.repo.html_url }}
          HEAD_REF:      ${{ github.head_ref }}
          BASE_REPO_URL: ${{ github.event.pull_request.base.repo.html_url }}
          BASE_REF:      ${{ github.base_ref }}
        run: |
          set -f
          for file in ${DELETED_FILES}; do
            echo Deleted: "${file}"
            echo "* Deleted: [${file}](https://myhdf5.hdfgroup.org/view?url=${HEAD_REPO_URL}/${HEAD_REF}/blob/${file})" >> diffs.md
            echo "  * Original: [${file}](https://myhdf5.hdfgroup.org/view?url=${BASE_REPO_URL}/${BASE_REF}/blob/${file})" >> diffs.md
          done
      - name: Identify any modified HDF5 files
        env:
          MODIFIED_FILES: ${{ steps.changed-files.outputs.modified_files }}
          HEAD_REPO_URL:  ${{ github.event.pull_request.head.repo.html_url }}
          HEAD_REF:       ${{ github.head_ref }}
          BASE_REPO_URL:  ${{ github.event.pull_request.base.repo.html_url }}
          BASE_REF:       ${{ github.base_ref }}
        run: |
          set -f
          for file in ${MODIFIED_FILES}; do
            echo Modified: "${file}"
            echo "* Modified: [${file}](https://myhdf5.hdfgroup.org/view?url=${HEAD_REPO_URL}/${HEAD_REF}/blob/${file})" >> diffs.md
            echo "  * Original: [${file}](https://myhdf5.hdfgroup.org/view?url=${BASE_REPO_URL}/${BASE_REF}/blob/${file})" >> diffs.md
            echo '```'  >> diffs.md
            FILE_SIZE=$(stat -c%s "${file}")
            if (( FILE_SIZE < 102400 )); then
              git difftool --no-prompt --tool="hdf5diff" "${HEAD_REF}" "origin/${BASE_REF}" -- "${file}" >> diffs.md
            else
              echo "File is too large to display diff" >> diffs.md
            fi
            echo '```'  >> diffs.md
          done
      - name: Check file existence
        id: check_files
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3
        with:
          files: diffs.md
      - name: Wrap warnings in collapsible section
        if: steps.check_files.outputs.files_exists == 'true'
        run: |
          printf '<details><summary>HDF5 file differences (click to expand)</summary>\n\n' > diffs-collapsible.md
          cat diffs.md >> diffs-collapsible.md
          printf '\n\n</details>\n' >> diffs-collapsible.md
      - name: Comment on the PR if any diffs were found
        if: steps.check_files.outputs.files_exists == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        with:
          file-path: diffs-collapsible.md
      - name: Add a step summary
        if: steps.check_files.outputs.files_exists == 'true'
        run: |
          cat diffs.md >> $GITHUB_STEP_SUMMARY
          
