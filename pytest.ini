[pytest]
# Discover tests anywhere under the python/ tree.  Per-package tests live in
# their own `tests/` subdirectory (e.g. `python/List/tests/`) alongside an
# existing legacy location at
# `python/Galacticus/Build/SourceTree/tests/` for SourceTree regressions.
# `scripts/doc` carries regression tests for the ReadTheDocs doc-extraction
# tooling (e.g. `scripts/doc/tests/test_extractDocsRST.py`); `scripts/build`
# carries tests for build-time generators (e.g. the parameter-file schema).
testpaths = python scripts/doc scripts/build
python_files = test_*.py
python_functions = test_*
# Markers.  `slow` covers tests that sweep the whole `source/` tree rather than
# a fixture — they are the ones that catch parser gaps on real code, so they
# run by default, but a tight edit/test loop can skip them with
#   python -m pytest -m "not slow"
markers =
    slow: sweeps the entire source/ tree (tens of seconds)
